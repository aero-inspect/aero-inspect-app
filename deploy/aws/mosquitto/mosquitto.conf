# Broker MQTT de AeroInspect en AWS. El listener TLS (8883) lo agrega entrypoint.sh cuando
# encuentra el certificado de mqtt.<DOMAIN>.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Solo para el monolito, dentro de la red de Docker: el compose no publica este puerto.
listener 1883
